<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site blocked</title>
    <link rel="icon" href="../icons/on-32.png" />
    <link rel="stylesheet" href="blocked.css" />
    <script type="module" src="blocked.js"></script>
  </head>
  <body>
    <main>
      <img class="icon" src="../icons/on-128.png" alt="" />
      <h1><span id="site">This site</span> is blocked</h1>
      <p id="reminder" class="reminder" hidden></p>
      <p id="status">
        To visit it, take a break or remove the site in the Site Blocker menu.
      </p>
      <form id="borrow" class="borrow" hidden>
        <label for="reason">What do you need it for?</label>
        <input
          id="reason"
          type="text"
          maxlength="140"
          autocomplete="off"
          required
        />
        <div id="borrow-options" class="actions"></div>
      </form>
      <div class="actions">
        <button id="take" class="primary" type="button" hidden></button>
        <button id="continue" class="primary" type="button" hidden>
          Continue
        </button>
        <button id="back" type="button" hidden>Go back</button>
        <button id="borrow-open" type="button" hidden>Borrow time</button>
      </div>
    </main>
  </body>
</html>
