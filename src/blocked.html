<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site blocked</title>
    <link rel="icon" href="../icons/on-32.png" />
    <link rel="stylesheet" href="blocked.css" />
    <script type="module" src="blocked.js"></script>
  </head>
  <body>
    <main>
      <img class="icon" src="../icons/on-128.png" alt="" />
      <h1><span id="site">This site</span> is blocked</h1>
      <p id="status">
        To visit it, turn off blocking or remove the site in the Site Blocker
        menu.
      </p>
      <div class="actions">
        <button id="request" class="primary" type="button" hidden></button>
        <button id="start" class="primary" type="button" hidden></button>
        <button id="continue" class="primary" type="button" hidden>
          Continue
        </button>
        <button id="cancel" type="button" hidden>Cancel</button>
        <button id="back" type="button" hidden>Go back</button>
      </div>
    </main>
  </body>
</html>
